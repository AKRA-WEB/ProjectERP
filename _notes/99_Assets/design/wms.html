<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>อรุณ · WMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: var(--bg-sunken); }
    .wms-app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; font-family: var(--font-sans); }
    .wms-sb { background: white; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 0; }
    .wms-brand { display: flex; align-items: center; gap: 10px; padding: 0 16px 8px; }
    .wms-logo { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; display: grid; place-items: center; font-weight: 700; font-family: var(--font-display); }
    .wms-brand-name { font-size: 14px; font-weight: 600; }
    .wms-brand-sub { font-size: 11px; color: var(--ink-3); }
    .wms-back { display: block; margin: 0 12px 6px; padding: 6px 10px; font-size: 12px; color: var(--ink-3); text-decoration: none; border-radius: 6px; }
    .wms-back:hover { background: var(--bg-sunken); color: var(--ink); }
    .wms-section { padding: 14px 16px 6px; font-size: 10.5px; font-weight: 600; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
    .wms-nav { display: flex; flex-direction: column; gap: 1px; padding: 0 8px; }
    .wms-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
    .wms-item:hover { background: var(--bg-soft); color: var(--ink); }
    .wms-item.is-active { background: #eef2ff; color: #4338ca; font-weight: 500; }
    .wms-foot { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--line-soft); }
    .wms-user { display: flex; gap: 10px; align-items: center; }
    .wms-av { width: 30px; height: 30px; border-radius: 7px; background: #e0e7ff; color: #4338ca; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
    .wms-user-name { font-size: 13px; font-weight: 500; }
    .wms-user-role { font-size: 11px; color: var(--ink-3); }
    .wms-main { display: flex; flex-direction: column; min-width: 0; }
    .wms-tb { background: white; border-bottom: 1px solid var(--line); padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
    .wms-tb-crumb { font-size: 11.5px; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
    .wms-tb-title { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin: 2px 0 0; }
    .wms-tb > div:first-child { flex: 1; }
    .wms-wh-select { background: white; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit; }
    .wms-page { padding: 22px 24px; flex: 1; }

    /* Warehouse cards (Stock Balances) */
    .wms-wh-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
    .wms-wh-card { background: white; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .wms-wh-card-h { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .wms-wh-card-h > div:first-child { flex: 1; min-width: 0; }
    .wms-wh-id { font-size: 11px; color: var(--ink-3); letter-spacing: .04em; }
    .wms-wh-name { font-size: 14px; font-weight: 600; color: var(--ink); margin-top: 1px; }
    .wms-wh-icon { width: 32px; height: 32px; border-radius: 8px; background: #eef2ff; color: #4338ca; display: grid; place-items: center; flex-shrink: 0; }
    .wms-wh-total { font-size: 24px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
    .wms-wh-total .unit { font-size: 12px; font-weight: 400; color: var(--ink-3); margin-left: 4px; }
    .wms-wh-bar { height: 5px; background: var(--bg-sunken); border-radius: 99px; margin: 8px 0 6px; overflow: hidden; }
    .wms-wh-bar-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #818cf8); border-radius: 99px; }
    .wms-wh-meta { display: flex; gap: 10px; font-size: 11.5px; color: var(--ink-2); }
    .wms-wh-meta b { color: var(--ink); }
    .wms-wh-meta .spacer { flex: 1; }
    @media (max-width: 1100px) { .wms-wh-cards { grid-template-columns: repeat(2, 1fr); } }

    /* Heatmap matrix */
    .wms-balance-tbl .heat-h { color: #4338ca; font-weight: 600; }
    .wms-balance-tbl .heat-cell { transition: background .15s; }
    .wms-balance-foot td { background: var(--bg-sunken); border-top: 2px solid var(--line) !important; }
    .wms-heat-legend { display: flex; gap: 6px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line-soft); background: var(--bg-soft); border-radius: 0 0 12px 12px; }
    .heat-chip { font-family: var(--font-mono); font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="wms.jsx"></script>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById("root")).render(<window.WMSApp />);
  </script>
</body>
</html>
