<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>อรุณ · เลือกระบบงาน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root {
      --paper: #f6f4ef;
      --paper-2: #efece4;
      --ink-warm: #1c1917;
      --ink-warm-2: #44403c;
      --ink-warm-3: #78716c;
      --hair: #e4e0d6;
      --hair-soft: #ece8de;
      --gold: #8a6a2b;
    }
    body { background: var(--paper); color: var(--ink-warm); }

    .mm-wrap {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 56px 24px;
      font-family: var(--font-sans);
    }

    /* Header */
    .mm-head { text-align: center; margin-bottom: 56px; }
    .mm-brand {
      display: inline-flex; align-items: center; gap: 12px;
      padding: 6px 14px 6px 6px;
      border: 1px solid var(--hair);
      background: rgba(255,255,255,.55);
      border-radius: 999px;
      margin-bottom: 22px;
    }
    .mm-mark {
      width: 28px; height: 28px; border-radius: 999px;
      background: var(--ink-warm); color: var(--paper);
      display: grid; place-items: center;
      font-family: var(--font-display);
      font-weight: 600; font-size: 14px;
      letter-spacing: 0;
    }
    .mm-brand-name {
      font-size: 12px; letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink-warm-2);
      font-weight: 500;
    }
    .mm-title {
      font-family: var(--font-display);
      font-size: 34px; font-weight: 500;
      letter-spacing: -.025em;
      color: var(--ink-warm);
      margin: 0;
    }
    .mm-sub {
      font-size: 13px;
      color: var(--ink-warm-3);
      margin-top: 10px;
      letter-spacing: .02em;
    }

    /* Grid of big icons */
    .mm-grid {
      display: grid;
      grid-template-columns: repeat(5, 180px);
      gap: 0;
      border-top: 1px solid var(--hair);
      border-bottom: 1px solid var(--hair);
    }
    .mm-card {
      position: relative;
      display: flex; flex-direction: column;
      align-items: center;
      padding: 44px 20px 32px;
      text-decoration: none;
      color: inherit;
      border-right: 1px solid var(--hair);
      transition: background .18s ease;
    }
    .mm-card:last-child { border-right: 0; }
    .mm-card:hover { background: rgba(255,255,255,.55); }
    .mm-card:hover .mm-ico { color: var(--ink-warm); }
    .mm-card:hover .mm-arrow { opacity: 1; transform: translateX(2px); }

    .mm-ico {
      width: 96px; height: 96px;
      display: grid; place-items: center;
      color: var(--ink-warm-2);
      transition: color .18s ease, transform .25s ease;
      margin-bottom: 24px;
    }
    .mm-card:hover .mm-ico { transform: translateY(-2px); }
    .mm-ico svg { width: 100%; height: 100%; display: block; }

    .mm-name {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -.005em;
      color: var(--ink-warm);
      text-align: center;
    }
    .mm-tag {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink-warm-3);
      margin-top: 8px;
    }
    .mm-arrow {
      position: absolute; bottom: 14px; right: 14px;
      width: 16px; height: 16px;
      color: var(--ink-warm-3);
      opacity: 0;
      transition: opacity .2s ease, transform .25s ease;
    }

    /* Footer / user */
    .mm-foot {
      margin-top: 40px;
      display: flex; align-items: center; gap: 14px;
      font-size: 12.5px; color: var(--ink-warm-3);
    }
    .mm-av {
      width: 30px; height: 30px; border-radius: 999px;
      background: var(--paper-2);
      border: 1px solid var(--hair);
      color: var(--ink-warm-2);
      display: grid; place-items: center;
      font-size: 11px; font-weight: 600;
      letter-spacing: .04em;
    }
    .mm-dot { width: 4px; height: 4px; border-radius: 99px; background: var(--hair); }
    .mm-foot .role { color: var(--ink-warm-2); font-weight: 500; }

    /* Bottom rule */
    .mm-rule {
      display: flex; align-items: center; gap: 14px;
      margin-top: 56px;
      color: var(--ink-warm-3);
      font-family: var(--font-mono);
      font-size: 10.5px; letter-spacing: .22em;
      text-transform: uppercase;
    }
    .mm-rule::before, .mm-rule::after {
      content: ""; flex: 1; height: 1px; background: var(--hair);
      min-width: 48px;
    }

    @media (max-width: 1000px) {
      .mm-grid { grid-template-columns: repeat(3, 1fr); width: 100%; max-width: 640px; }
      .mm-card:nth-child(3n) { border-right: 0; }
      .mm-card:nth-child(-n+3) { border-bottom: 1px solid var(--hair); }
    }
    @media (max-width: 640px) {
      .mm-grid { grid-template-columns: repeat(2, 1fr); max-width: 440px; }
      .mm-card { border-right: 1px solid var(--hair) !important; border-bottom: 1px solid var(--hair) !important; }
      .mm-card:nth-child(2n) { border-right: 0 !important; }
      .mm-card:last-child { border-bottom: 0 !important; }
    }
    @media (max-width: 480px) {
      .mm-title { font-size: 26px; }
      .mm-ico { width: 76px; height: 76px; margin-bottom: 18px; }
    }
  </style>
</head>
<body>

        <div class="mm-tag">Accounting</div>
        <svg class="mm-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
      </a>

      <a class="mm-card" href="ERP Dashboard.html" aria-label="HR">
        <div class="mm-ico" aria-hidden="true">
          <!-- HR · figure + ring -->
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">

        <div class="mm-tag">Admin</div>
        <svg class="mm-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>

    <div class="mm-foot">
      <div class="mm-av">ปร</div>

    <div class="mm-rule">v 2.4 · พฤษภาคม 2569</div>
