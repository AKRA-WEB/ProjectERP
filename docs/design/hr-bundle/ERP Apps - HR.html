<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BUYMORETH ERP · HR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans Thai"', '"IBM Plex Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
            display: ['"IBM Plex Sans Thai"', '"IBM Plex Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    html, body { background: #f0eee9; }
    body { font-family: "IBM Plex Sans Thai", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }
    .font-display { font-family: "IBM Plex Sans Thai", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }
    .font-mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="apps/hr-mock-data.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="apps/erp-shell.jsx"></script>
  <script type="text/babel" src="apps/hr-dashboard.jsx"></script>
  <script type="text/babel" src="apps/hr-employees.jsx"></script>
  <script type="text/babel" src="apps/hr-leave.jsx"></script>
  <script type="text/babel" src="apps/hr-payroll.jsx"></script>
  <script type="text/babel" src="apps/hr-mobile.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;

    function App() {
      return (
        <DesignCanvas title="BUYMORETH ERP · HR" subtitle="โมดูลบุคลากร — Dashboard · พนักงาน · การลา · เงินเดือน · Mobile self-service">
          <DCSection id="hr-overview" title="ภาพรวม · HR Dashboard" subtitle="KPI · attendance วันนี้ · คำขอลา · headcount · 7 วันข้างหน้า">
            <DCArtboard id="hr-dashboard" label="Desktop · 1440×900" width={1440} height={900}>
              <HrDashboard />
            </DCArtboard>
          </DCSection>

          <DCSection id="hr-employees" title="พนักงาน · Employees" subtitle="ทะเบียนพนักงาน — ค้นหา · กรอง · ดูข้อมูลรายคน">
            <DCArtboard id="hr-employees-desktop" label="Desktop · 1440×900" width={1440} height={900}>
              <HrEmployees />
            </DCArtboard>
          </DCSection>

          <DCSection id="hr-leave" title="การลา · Leave" subtitle="อนุมัติคำขอลา · ปฏิทินทีม (Gantt-style) ทั้งเดือน">
            <DCArtboard id="hr-leave-desktop" label="Desktop · 1440×900" width={1440} height={900}>
              <HrLeave />
            </DCArtboard>
          </DCSection>

          <DCSection id="hr-payroll" title="เงินเดือน · Payroll" subtitle="งวด พ.ค. 2569 · workflow · สรุป · ตารางการคำนวณรายคน">
            <DCArtboard id="hr-payroll-desktop" label="Desktop · 1440×900" width={1440} height={900}>
              <HrPayroll />
            </DCArtboard>
          </DCSection>

          <DCSection id="hr-mobile" title="พนักงาน · Self-Service" subtitle="แอปสำหรับพนักงาน — เข้า/ออกงาน · โควต้าลา · สลิป">
            <DCArtboard id="hr-mobile-app" label="Mobile · 390×844" width={390} height={844}>
              <HrMobile />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    function ready() {
      return window.HrDashboard && window.HrEmployees && window.HrLeave && window.HrPayroll && window.HrMobile && window.ErpShell && window.DesignCanvas;
    }
    (function mount() {
      if (!ready()) return setTimeout(mount, 40);
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    })();
  </script>
</body>
</html>
