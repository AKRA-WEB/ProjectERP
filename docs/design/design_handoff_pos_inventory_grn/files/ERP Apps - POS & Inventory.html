<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BUYMORETH ERP · POS &amp; Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* Tailwind config — mirrored from tailwind.config.ts in the real repo */
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans Thai"', '"IBM Plex Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
            display: ['"IBM Plex Sans Thai"', '"IBM Plex Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    html, body { background: #f0eee9; }
    body { font-family: "IBM Plex Sans Thai", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }
    .font-display { font-family: "IBM Plex Sans Thai", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }
    .font-mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    /* line-clamp helper (Tailwind 3 has it via plugin; we add manually so CDN works) */
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="apps/erp-mock-data.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="apps/erp-shell.jsx"></script>
  <script type="text/babel" src="apps/pos-terminal.jsx"></script>
  <script type="text/babel" src="apps/inventory.jsx"></script>
  <script type="text/babel" src="apps/pos-mobile.jsx"></script>
  <script type="text/babel" src="apps/inventory-mobile.jsx"></script>
  <script type="text/babel" src="apps/grn-desktop.jsx"></script>
  <script type="text/babel" src="apps/grn-mobile-queue.jsx"></script>
  <script type="text/babel" src="apps/grn-mobile-receive.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;

    function App() {
      return (
        <DesignCanvas title="BUYMORETH ERP" subtitle="Hi-fi screens recreated from AKRA-WEB/ProjectERP — desktop + mobile">
          <DCSection id="pos" title="ขายหน้าร้าน · POS" subtitle="Cashier terminal — session in progress, cart filled, awaiting checkout">
            <DCArtboard id="pos-terminal" label="Desktop · 1440×900" width={1440} height={900}>
              <PosTerminal />
            </DCArtboard>
            <DCArtboard id="pos-mobile" label="Mobile · 390×844" width={390} height={844}>
              <PosMobile />
            </DCArtboard>
          </DCSection>

          <DCSection id="wms" title="คลังสินค้า · Inventory" subtitle="Stock list across warehouses — table on desktop, cards on mobile">
            <DCArtboard id="inventory" label="Desktop · 1440×900" width={1440} height={900}>
              <InventoryPage />
            </DCArtboard>
            <DCArtboard id="inventory-mobile" label="Mobile · 390×844" width={390} height={844}>
              <InventoryMobile />
            </DCArtboard>
          </DCSection>

          <DCSection id="grn" title="รับสินค้า · Goods Receive (GRN)" subtitle="แอดมินตรวจบนคอม · พนักงานรับสินค้าบนมือถือ">
            <DCArtboard id="grn-desktop" label="Admin · 1440×900" width={1440} height={900}>
              <GrnDesktop />
            </DCArtboard>
            <DCArtboard id="grn-queue-mobile" label="Staff · คิวรับ · 390×844" width={390} height={844}>
              <GrnMobileQueue />
            </DCArtboard>
            <DCArtboard id="grn-receive-mobile" label="Staff · รับสินค้า · 390×844" width={390} height={844}>
              <GrnMobileReceive />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    /* Wait until all babel-transformed scripts have registered their components */
    function ready() {
      return window.PosTerminal && window.InventoryPage && window.PosMobile && window.InventoryMobile && window.GrnDesktop && window.GrnMobileQueue && window.GrnMobileReceive && window.ErpShell && window.DesignCanvas;
    }
    (function mount() {
      if (!ready()) return setTimeout(mount, 40);
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    })();
  </script>
</body>
</html>
